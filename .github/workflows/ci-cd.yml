name: ROBOTECH CI - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VITE_API_BASE_URL: https://localhost:8000
  DOCKER_REGISTRY: docker.io
  DOCKER_REPO: jeetumodi/robotech

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------- Backend ----------------
      - name: Build & Push Backend Production Image
        run: |
          IMAGE="$DOCKER_REGISTRY/$DOCKER_REPO-backend:${GITHUB_SHA::8}"
          IMAGE_LATEST="$DOCKER_REGISTRY/$DOCKER_REPO-backend:latest"

          docker build -t $IMAGE -t $IMAGE_LATEST -f Dockerfile.backend.prod .
          docker push $IMAGE
          docker push $IMAGE_LATEST

      # ---------------- Frontend ----------------
      - name: Build & Push Frontend Production Image
        run: |
          IMAGE="$DOCKER_REGISTRY/$DOCKER_REPO-frontend:${GITHUB_SHA::8}"
          IMAGE_LATEST="$DOCKER_REGISTRY/$DOCKER_REPO-frontend:latest"

          docker build \
            -f Dockerfile.frontend.prod \
            --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL \
            -t $IMAGE -t $IMAGE_LATEST .

          docker push $IMAGE
          docker push $IMAGE_LATEST

      # ---------------- Discord Failure Notification ----------------
      - name: Discord Notification (on failure)
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"content\": \"❌ CI FAILED\nRepository: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.run_number }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}