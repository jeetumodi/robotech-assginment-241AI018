server {
    listen 80;
    server_name jeetumodi.me robotech.jeetumodi.me;  # Replace with your domain
    # If testing only → use: server_name _;

    # Frontend
    location / {
        proxy_pass http://robotech-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/ {
        proxy_pass http://robotech-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://robotech-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}